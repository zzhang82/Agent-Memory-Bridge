name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check installed package metadata
        run: >
          python -c "import importlib.metadata as metadata, pathlib, tomllib;
          expected = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'];
          actual = metadata.version('agent-memory-bridge');
          assert actual == expected, f'installed package version mismatch: expected {expected}, got {actual}';
          print(actual)"

      - name: Run tests
        run: python -m pytest

      - name: Run release contract check
        run: python scripts/check_release_contract.py

      - name: Run public surface check
        run: python scripts/check_public_surface.py

      - name: Run onboarding contract check
        run: python scripts/check_onboarding_contract.py

  quality:
    name: Quality gates / Python 3.13
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Ruff format
        run: ruff format --check src tests scripts

      - name: Core typing
        run: >
          mypy
          src/agent_mem_bridge/schema.py
          src/agent_mem_bridge/storage.py
          src/agent_mem_bridge/provenance.py
          src/agent_mem_bridge/repository.py
          src/agent_mem_bridge/signals.py
          src/agent_mem_bridge/query.py
          src/agent_mem_bridge/state_io.py
          src/agent_mem_bridge/command_provider.py
          src/agent_mem_bridge/database_maintenance.py
          src/agent_mem_bridge/release_contract.py
          src/agent_mem_bridge/run_ledger.py
          src/agent_mem_bridge/run_projection.py
          src/agent_mem_bridge/run_consolidation.py
          src/agent_mem_bridge/server.py
          src/agent_mem_bridge/mcp_boundary.py
          src/agent_mem_bridge/stdio_probe.py

      - name: Core branch coverage
        run: >
          python -m pytest
          --cov=agent_mem_bridge.schema
          --cov=agent_mem_bridge.provenance
          --cov=agent_mem_bridge.repository
          --cov=agent_mem_bridge.signals
          --cov=agent_mem_bridge.query
          --cov=agent_mem_bridge.state_io
          --cov=agent_mem_bridge.command_provider
          --cov=agent_mem_bridge.database_maintenance
          --cov=agent_mem_bridge.run_ledger
          --cov=agent_mem_bridge.run_projection
          --cov=agent_mem_bridge.run_consolidation
          --cov=agent_mem_bridge.revisions
          --cov=agent_mem_bridge.service
          --cov=agent_mem_bridge.service_lock
          --cov=agent_mem_bridge.service_health
          --cov=agent_mem_bridge.record_projection
          --cov=agent_mem_bridge.poll_cursor
          --cov=agent_mem_bridge.server
          --cov=agent_mem_bridge.mcp_boundary
          --cov=agent_mem_bridge.stdio_probe
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=80

      - name: MCP boundary branch coverage
        run: |
          python -m pytest \
            tests/test_mcp_boundary.py \
            tests/test_stdio_probe.py \
            tests/test_mcp_raw_wire.py \
            tests/test_v026_dual_era.py \
            tests/test_cli_verify.py \
            tests/test_cli_doctor.py \
            --cov=agent_mem_bridge.mcp_boundary \
            --cov=agent_mem_bridge.server \
            --cov=agent_mem_bridge.stdio_probe \
            --cov-branch \
            --cov-report=json:mcp-coverage.json
          python scripts/check_mcp_boundary_coverage.py mcp-coverage.json

      - name: Audit dependencies
        run: pip-audit

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Build hardened Docker runtime
        run: docker build --tag agent-memory-bridge:ci .

      - name: Smoke-test Docker version and non-root user
        run: |
          docker run --rm agent-memory-bridge:ci python -m agent_mem_bridge --version
          docker run --rm agent-memory-bridge:ci python -c "import os; assert os.getuid() == 10001"

  legacy-sdk-compat:
    name: Compatibility / Python MCP 1.28.1 client
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build isolated server and legacy client environments
        run: |
          python -m venv "$RUNNER_TEMP/amb-server-venv"
          "$RUNNER_TEMP/amb-server-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/amb-server-venv/bin/python" -m pip install .
          python -m venv "$RUNNER_TEMP/amb-legacy-client-venv"
          "$RUNNER_TEMP/amb-legacy-client-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/amb-legacy-client-venv/bin/python" -m pip install "mcp==1.28.1"

      - name: Prove Python MCP 1.28.1 interoperability
        run: >
          "$RUNNER_TEMP/amb-legacy-client-venv/bin/python"
          scripts/run_mcp_legacy_compat.py
          --server-python "$RUNNER_TEMP/amb-server-venv/bin/python"
          --project-root "$GITHUB_WORKSPACE"
          --runtime-dir "$RUNNER_TEMP/amb-legacy-compat"

  modern-protocol-compat:
    name: Compatibility / Python MCP 2.0 raw wire and reliability
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Prove raw-wire and dual-era operator contracts
        run: >
          python -m pytest
          tests/test_mcp_boundary.py
          tests/test_mcp_raw_wire.py
          tests/test_v026_dual_era.py
          tests/test_cli_verify.py
          tests/test_cli_doctor.py

      - name: Prove concurrent writes and process cleanup
        run: >
          python scripts/run_mcp_reliability_proof.py
          --project-root "$GITHUB_WORKSPACE"
          --runtime-dir "$RUNNER_TEMP/amb-mcp-reliability"
          --writers 20
          --cycles 100

  typescript-sdk-compat:
    name: Compatibility / TypeScript MCP client 2.0.0
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install AMB server
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Install exact TypeScript MCP client
        run: npm install --no-package-lock --no-save "@modelcontextprotocol/client@2.0.0"

      - name: Prove TypeScript modern interoperability
        run: >
          node scripts/mcp_ts_compat.mjs
          python
          "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/amb-typescript-compat"
