name: Release cut acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-distributions:
    name: Installed ${{ matrix.distribution }} stdio acceptance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distribution: [wheel, sdist]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Create clean install environment
        run: |
          python -m venv "$RUNNER_TEMP/amb-release-venv"
          "$RUNNER_TEMP/amb-release-venv/bin/python" -m pip install --upgrade pip

      - name: Install wheel
        if: matrix.distribution == 'wheel'
        run: >
          "$RUNNER_TEMP/amb-release-venv/bin/python" -m pip install dist/*.whl

      - name: Install sdist
        if: matrix.distribution == 'sdist'
        run: >
          "$RUNNER_TEMP/amb-release-venv/bin/python" -m pip install dist/*.tar.gz

      - name: Prove installed distribution over stdio
        run: |
          version="$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          python scripts/check_installed_distribution.py \
            --server-python "$RUNNER_TEMP/amb-release-venv/bin/python" \
            --expected-version "$version"

      - name: Check announcement and release contracts
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_release_candidate.py tests/test_gateway_contract_docs.py -q
          python scripts/check_release_contract.py
          python scripts/check_release_version_pins.py
